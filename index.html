<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca do Francisco</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--muted:#6b6f76;--line:#e3dfd6;--accent:#b5452b;--accent2:#1f3864;--ok:#2e7d4f;--warn:#a86b00;--chip:#efe9dd}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--card:#20242a;--ink:#eceae5;--muted:#a3a7ad;--line:#33383f;--accent:#e0765a;--accent2:#8fb0e8;--ok:#5cc28a;--warn:#e0a63a;--chip:#2b3037}}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--accent2);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-family:Georgia,"Times New Roman",serif;font-size:1.35rem;margin:0;flex:1}
header .who{font-size:.85rem;opacity:.9}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
nav button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:.9rem}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:16px;max-width:1300px;margin:0 auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:.9rem}
.filters label{font-size:.88rem;color:var(--muted);display:flex;gap:5px;align-items:center}
.count{color:var(--muted);font-size:.85rem;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cover{height:210px;background:var(--chip);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover img{max-height:100%;max-width:100%;object-fit:contain}
.ph{font-family:Georgia,serif;font-size:2.4rem;color:var(--muted);text-align:center;padding:10px}
.ph small{display:block;font-size:.8rem;margin-top:6px;font-family:inherit}
.body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.serie{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.titulo{font-weight:600;line-height:1.25}
.orig{font-size:.82rem;color:var(--muted);font-style:italic}
.prices{display:flex;gap:10px;font-size:.88rem}
.prices b{font-variant-numeric:tabular-nums}
.links{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.links a{font-size:.75rem;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--ink);background:var(--bg)}
.act{margin-top:auto;padding-top:6px}
.btn{width:100%;border:0;border-radius:8px;padding:9px;font-size:.9rem;cursor:pointer;background:var(--accent);color:#fff}
.btn.sec{background:var(--chip);color:var(--ink)}
.badge{display:inline-block;font-size:.78rem;padding:3px 8px;border-radius:999px;background:var(--chip)}
.badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)}
.star{color:#d4a017}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem;vertical-align:top}
th{background:var(--chip)}
.wrap{overflow-x:auto}
#login{max-width:420px;margin:12vh auto;text-align:center;background:var(--card);padding:28px;border-radius:14px;border:1px solid var(--line)}
#login h2{font-family:Georgia,serif;margin-top:0}
#gbtn{display:flex;justify-content:center;margin:18px 0}
.origin{font-size:.72rem;color:var(--muted);word-break:break-all}
.err{color:var(--accent);margin-top:10px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20}
#modal .box{background:var(--card);padding:20px;border-radius:12px;max-width:380px;width:90%}
#modal .row{display:flex;gap:8px;margin-top:16px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:30;font-size:.9rem}
.loading{opacity:.5;pointer-events:none}
.cover{position:relative}
.cedit{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.cedit button{border:0;border-radius:8px;padding:6px 8px;cursor:pointer;background:rgba(0,0,0,.6);color:#fff;font-size:.85rem}
.cedit button:hover{background:rgba(0,0,0,.8)}
.scard{cursor:pointer;transition:transform .15s}
.scard:hover{transform:translateY(-2px)}
.scard .cover{height:170px}
.kpi{display:flex;align-items:baseline;gap:8px}
.kpi .big{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .small{color:var(--muted);font-size:.85rem}
.bar{height:8px;border-radius:999px;background:var(--chip);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent2)}
.bar.done span{background:var(--ok)}
.done-flag{position:absolute;top:8px;left:8px;background:var(--ok);color:#fff;font-size:.78rem;font-weight:600;padding:4px 9px;border-radius:999px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:.72rem;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.owned-badge{display:inline-block;font-size:.78rem;padding:3px 8px;border-radius:999px;background:var(--ok);color:#fff}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:15;overflow-y:auto;padding:24px 12px}
#sheet .panel{background:var(--bg);max-width:1200px;margin:0 auto;border-radius:14px;padding:18px;border:1px solid var(--line)}
#sheet .top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
#sheet .top h2{margin:0;font-family:Georgia,serif;flex:1}
#sheet .close{border:0;background:var(--chip);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:1rem}
#modal{z-index:40}
#modal input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:10px}
#modal img{max-width:100%;max-height:200px;display:block;margin:10px auto 0}
</style>
</head>
<body>

<div id="login">
  <h2>📚 Biblioteca do Francisco</h2>
  <p>Inicia sessão com a tua conta Google para veres a lista.</p>
  <div id="gbtn"></div>
  <div id="loginErr" class="err"></div>
  <p class="origin">Origem desta página: <span id="orig"></span></p>
</div>

<div id="app" style="display:none">
  <header><h1>📚 Biblioteca do Francisco</h1><span class="who" id="who"></span><button class="btn sec" style="width:auto;padding:6px 10px" onclick="google.accounts.id.disableAutoSelect();logout()">Sair</button></header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel" id="sheetPanel"></div></div>
<div id="modal"><div class="box"><div id="mtext"></div><div class="row">
  <button class="btn sec" id="mno">Cancelar</button><button class="btn" id="myes">Confirmar</button></div></div></div>
<div id="toast"></div>

<script>
/* ====== CONFIGURAÇÃO: preencher estes dois valores ====== */
const CLIENT_ID = '266726387892-siuc44ev8jjib80trlb12ocm52ihvtph.apps.googleusercontent.com';
const API_URL   = 'https://script.google.com/macros/s/AKfycbyVB9XtjMt-aIIARwjzHAOHCF8XfXkieZLVBr-lke-aKf8U6NmgFOyj4QBdCqgsBXni/exec';
/* ======================================================== */
let TOKEN = null, DATA = null, VIEW = 'falta', OPEN_SERIE = null;
const F = { serie: '', q: '', sort: 'prio', soPrio: false, esconder: false };
const C = { q: '', autor: '', idioma: '', editora: '', estado: '', soPrio: false, sort: 'nome' };

document.getElementById('orig').textContent = location.origin;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && OPEN_SERIE && document.getElementById('modal').style.display !== 'flex') closeSheet(); });

function tokenExp(t) { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch (e) { return 0; } }

function initGis() {
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: r => {
    TOKEN = r.credential;
    try { sessionStorage.setItem('bf_token', TOKEN); } catch (e) {}
    load();
  } });
  try {
    const saved = sessionStorage.getItem('bf_token');
    if (saved && tokenExp(saved) > Date.now() + 60000) { TOKEN = saved; load(); }
  } catch (e) {}
  google.accounts.id.renderButton(document.getElementById('gbtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with', locale: 'pt-PT' });
}

async function call(action, ...args) {
  if (TOKEN && tokenExp(TOKEN) < Date.now() + 30000) { logout('A sessão expirou. Volta a iniciar sessão.'); throw new Error('Sessão expirada.'); }
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, token: TOKEN, args }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function logout(msg) {
  TOKEN = null; try { sessionStorage.removeItem('bf_token'); } catch (e) {}
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'block';
  document.getElementById('loginErr').textContent = msg || '';
}

async function load() {
  try {
    DATA = await call('getData');
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('who').textContent = 'Olá, ' + DATA.user.name;
    render();
  } catch (e) { logout(e.message || e); }
}

async function act(fn, ...args) {
  document.body.classList.add('loading');
  try { DATA = await call(fn, ...args); render(); }
  catch (e) { toast(e.message || e); if (/sessão/i.test(e.message || '')) logout(e.message); }
  finally { document.body.classList.remove('loading'); }
}

function ask(msg) {
  return new Promise(res => {
    const m = document.getElementById('modal');
    document.getElementById('mtext').innerHTML = msg;
    m.style.display = 'flex';
    document.getElementById('myes').onclick = () => { m.style.display = 'none'; res(true); };
    document.getElementById('mno').onclick = () => { m.style.display = 'none'; res(false); };
  });
}
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 3500); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = v => v == null ? '—' : v.toLocaleString('pt-PT', { style: 'currency', currency: 'EUR' });
const stars = p => p ? '<span class="star">' + '★'.repeat(4 - p) + '</span>' : '';
const short = s => s.split(' (')[0].split(' –')[0];

function render() {
  const tabs = DATA.user.owner
    ? [['falta', 'Em falta'], ['colecao', 'A minha coleção'], ['prio', 'Prioridades'], ['troca', 'Para troca']]
    : [['falta', 'Em falta'], ['minhas', 'As minhas reservas'], ['colecao', 'Coleção do Francisco'], ['troca', 'Para troca']];
  document.getElementById('nav').innerHTML = tabs.map(t =>
    `<button class="${VIEW === t[0] ? 'on' : ''}" onclick="VIEW='${t[0]}';render()">${t[1]}</button>`).join('');
  const m = document.getElementById('main');
  if (VIEW === 'falta') m.innerHTML = viewFalta();
  if (VIEW === 'minhas') m.innerHTML = viewMinhas();
  if (VIEW === 'colecao') m.innerHTML = viewColecao();
  if (VIEW === 'prio') m.innerHTML = viewPrio();
  if (VIEW === 'troca') m.innerHTML = viewTroca();
  if (OPEN_SERIE) renderSheet();
}

function viewFalta() {
  const series = [...new Set(DATA.books.map(b => b.serie))].sort((a, b) => a.localeCompare(b, 'pt'));
  let list = DATA.books.filter(b =>
    (!F.serie || b.serie === F.serie) &&
    (!F.soPrio || b.prio === 1) &&
    (!F.esconder || !b.reserva) &&
    (!F.q || (b.serie + ' ' + b.pt + ' ' + b.orig + ' ' + b.aut).toLowerCase().includes(F.q.toLowerCase())));
  const byNum = (a, b) => a.serie.localeCompare(b.serie, 'pt') || (parseFloat(a.n) || 999) - (parseFloat(b.n) || 999);
  const byPrice = k => (a, b) => (a[k] ?? 1e9) - (b[k] ?? 1e9) || byNum(a, b);
  const sorts = { prio: (a, b) => (a.prio || 9) - (b.prio || 9) || byNum(a, b), serie: byNum, novo: byPrice('pNovo'), usado: byPrice('p2') };
  list.sort(sorts[F.sort]);
  const filters = `<div class="filters">
    <input id="qs" type="search" placeholder="Pesquisar título, série, autor…" value="${esc(F.q)}" oninput="F.q=this.value;render();const s=document.getElementById('qs');s.focus();s.setSelectionRange(s.value.length,s.value.length)">
    <select onchange="F.serie=this.value;render()"><option value="">Todas as séries</option>${series.map(s => `<option ${s === F.serie ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
    <select onchange="F.sort=this.value;render()">
      ${[['prio', 'Ordenar: prioridade'], ['serie', 'Ordenar: série'], ['novo', 'Preço novo ↑'], ['usado', 'Preço 2.ª mão ↑']].map(o => `<option value="${o[0]}" ${F.sort === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}
    </select>
    <label><input type="checkbox" ${F.soPrio ? 'checked' : ''} onchange="F.soPrio=this.checked;render()"> Só prioritárias</label>
    ${DATA.user.owner ? '' : `<label><input type="checkbox" ${F.esconder ? 'checked' : ''} onchange="F.esconder=this.checked;render()"> Esconder reservados</label>`}
    <span class="count">${list.length} livros</span></div>`;
  return filters + `<div class="grid">${list.map(card).join('')}</div>`;
}

function card(b) {
  const title = b.pt || b.orig;
  const q = encodeURIComponent(short(b.serie) + ' ' + title.replace(/[()]/g, ''));
  const slug = (short(b.serie) + ' ' + title).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const qfr = encodeURIComponent(short(b.serie) + ' ' + (b.orig || title));
  const cover = coverHtml(b);
  let action = '';
  if (DATA.user.owner) action = `<button class="btn sec" onclick="recebi('${b.id}')">✔ Marcar como adquirido</button>`;
  else if (b.reserva === 'minha') action = `<span class="badge ok">✔ Reservado por ti</span>`;
  else if (b.reserva === 'outro') action = `<span class="badge warn">Já reservado</span>`;
  else action = `<button class="btn" onclick="reservar('${b.id}')">🎁 Já encomendei</button>`;
  return `<div class="card"><div class="cover">${cover}</div><div class="body">
    <div class="serie">${stars(b.prio)} ${esc(b.serie)}${b.n && b.n !== '—' ? ' · n.º ' + esc(b.n) : ''}</div>
    <div class="titulo">${esc(title)}</div>
    ${b.pt && b.orig && b.orig !== b.pt ? `<div class="orig">${esc(b.orig)}</div>` : ''}
    <div class="prices"><span>Novo: <b>${eur(b.pNovo)}</b></span><span>2.ª mão: <b>${eur(b.p2)}</b></span></div>
    <div class="links">
      <a target="_blank" rel="noopener" href="https://www.olx.pt/ads/q-${slug}/">OLX</a>
      <a target="_blank" rel="noopener" href="https://www.vinted.pt/catalog?search_text=${q}">Vinted</a>
      <a target="_blank" rel="noopener" href="https://www.wook.pt/pesquisa?keyword=${q}">Wook</a>
      <a target="_blank" rel="noopener" href="https://www.bertrand.pt/pesquisa/${q}">Bertrand</a>
      <a target="_blank" rel="noopener" href="https://www.bdfugue.com/catalogsearch/result/?q=${qfr}">BDfugue</a>
    </div>
    <div class="act">${action}</div></div></div>`;
}

async function reservar(id) {
  const b = DATA.books.find(x => x.id === id);
  if (await ask(`Confirmas que <b>já encomendaste</b> «${esc(b.pt || b.orig)}» (${esc(b.serie)})?<br><br>Os outros vão ver este livro como «Já reservado». O Francisco não vê nada.`))
    act('reserve', id);
}
async function recebi(id) {
  const b = DATA.books.find(x => x.id === id);
  if (await ask(`Marcar «${esc(b.pt || b.orig)}» como já estando na tua coleção?`)) act('markReceived', id, true);
}

function viewMinhas() {
  if (!DATA.mine.length) return '<p>Ainda não tens reservas. Quando encomendares um livro, marca-o com «Já encomendei».</p>';
  return `<div class="wrap"><table><tr><th>Livro</th><th>Desde</th><th>Estado</th><th></th></tr>${DATA.mine.map(r => `
    <tr><td><b>${esc(r.livro.t)}</b><br><small>${esc(r.livro.serie)} ${r.livro.n ? '· n.º ' + esc(r.livro.n) : ''}</small></td>
    <td>${esc(r.created)}</td>
    <td>${r.state === 'Concluída' ? '<span class="badge ok">O Francisco já tem este livro</span>' :
      `<select onchange="act('setReservationState','${r.id}',this.value)">${['Encomendado', 'Recebido', 'Oferecido'].map(s => `<option ${s === r.state ? 'selected' : ''}>${s}</option>`).join('')}</select>`}</td>
    <td>${r.state === 'Concluída' ? '' : `<button class="btn sec" onclick="retirar('${r.id}')">Retirar</button>`}</td></tr>`).join('')}</table></div>`;
}
async function retirar(id) { if (await ask('Retirar esta reserva? O livro volta a ficar disponível para os outros.')) act('setReservationState', id, 'Retirada'); }

function coverHtml(b) {
  const img = b.capa
    ? `<img src="${esc(b.capa)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=ph>📖</div>'">`
    : `<div class="ph">📖<small>${esc(short(b.serie))}</small></div>`;
  const edit = DATA.user.owner
    ? `<div class="cedit"><button title="Nova capa (URL)" onclick="event.stopPropagation();editCover('${b.id}')">✏️</button>${b.capa ? `<button title="Remover capa" onclick="event.stopPropagation();removeCover('${b.id}')">🗑</button>` : ''}</div>`
    : '';
  return img + edit;
}

function promptUrl(titulo, atual) {
  return new Promise(res => {
    const m = document.getElementById('modal');
    document.getElementById('mtext').innerHTML = `<b>Nova capa</b> — ${esc(titulo)}<br><small>Cola o endereço (https://…) de uma imagem. Dica: no site da livraria, botão direito na capa › «Copiar endereço da imagem».</small>
      <input id="urlIn" type="url" placeholder="https://…" value="${esc(atual || '')}" oninput="document.getElementById('urlPrev').src=this.value">
      <img id="urlPrev" src="${esc(atual || '')}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'" onload="this.style.display='block'">`;
    m.style.display = 'flex';
    document.getElementById('myes').onclick = () => { const v = document.getElementById('urlIn').value.trim(); m.style.display = 'none'; res(v || null); };
    document.getElementById('mno').onclick = () => { m.style.display = 'none'; res(null); };
  });
}
function findAlbum(id) { return DATA.books.find(x => x.id === id) || DATA.owned.find(x => x.id === id); }
async function editCover(id) {
  const b = findAlbum(id);
  const url = await promptUrl(b.pt || b.orig, b.capa);
  if (url) act('setCover', id, url);
}
async function removeCover(id) {
  const b = findAlbum(id);
  if (await ask(`Remover a capa de «${esc(b.pt || b.orig)}»?`)) act('setCover', id, '');
}
async function editSeriesCover(serie) {
  const s = DATA.series.find(x => x.serie === serie) || {};
  const url = await promptUrl('Série ' + serie, s.capa);
  if (url) act('setSeriesCover', serie, url);
}

const splitAut = a => String(a || '').split(/\s*[\/;,]\s*|\s+e\s+/).map(x => x.trim()).filter(x => x && x !== '—');
const splitEd = e => String(e || '').split(/\s*\/\s*/).map(x => x.replace(/\((PT|FR)\)/g, '').trim()).filter(x => x && x !== '—' && !/^\(/.test(x));
function volCount(n) {
  const m = String(n).match(/^(\d+)\s*[–-]\s*(\d+)$/);
  if (m) return { n: Number(m[2]) - Number(m[1]) + 1, approx: false };
  return { n: 1, approx: /\+|\?|restantes|seguintes/i.test(String(n)) };
}
function seriesStats() {
  const map = {};
  const get = s => map[s] || (map[s] = { serie: s, owned: [], missing: [], aut: new Set(), ed: new Set(), lang: new Set(), approx: false, miss: 0 });
  DATA.owned.forEach(b => { const x = get(b.serie); x.owned.push(b); splitAut(b.aut).forEach(a => x.aut.add(a)); splitEd(b.ed).forEach(e => x.ed.add(e)); x.lang.add(b.idioma); });
  DATA.books.forEach(b => {
    const x = get(b.serie); x.missing.push(b); splitAut(b.aut).forEach(a => x.aut.add(a));
    const v = volCount(b.n + ' ' + (b.pt || b.orig)); x.miss += volCount(b.n).n; if (v.approx || volCount(b.n).approx) x.approx = true;
  });
  const ser = {}; DATA.series.forEach(s => ser[s.serie] = s);
  return Object.values(map).map(x => {
    x.prio = (ser[x.serie] || {}).prio || null;
    x.capa = (ser[x.serie] || {}).capa || (x.owned.find(b => b.capa) || x.missing.find(b => b.capa) || {}).capa || '';
    x.total = x.owned.length + x.miss;
    x.pct = x.total ? Math.round(100 * x.owned.length / x.total) : 0;
    x.done = x.missing.length === 0 && x.owned.length > 0;
    x.group = /^Álbuns isolados|^Graphic novels/.test(x.serie);
    return x;
  });
}

function viewColecao() {
  const all = seriesStats();
  const autores = [...new Set(all.flatMap(x => [...x.aut]))].sort((a, b) => a.localeCompare(b, 'pt'));
  const editoras = [...new Set(all.flatMap(x => [...x.ed]))].sort((a, b) => a.localeCompare(b, 'pt'));
  const idiomas = [...new Set(all.flatMap(x => [...x.lang]))].sort();
  let list = all.filter(x =>
    (!C.q || (x.serie + ' ' + [...x.aut].join(' ') + ' ' + x.owned.concat(x.missing).map(b => b.pt + ' ' + b.orig).join(' ')).toLowerCase().includes(C.q.toLowerCase())) &&
    (!C.autor || x.aut.has(C.autor)) && (!C.idioma || x.lang.has(C.idioma)) && (!C.editora || x.ed.has(C.editora)) &&
    (!C.soPrio || x.prio === 1) &&
    (!C.estado || (C.estado === 'completa' ? x.done : C.estado === 'incompleta' ? !x.done && x.owned.length : C.estado === 'nova' ? !x.owned.length : true)));
  const sorts = {
    nome: (a, b) => a.group - b.group || a.serie.localeCompare(b.serie, 'pt'),
    pct: (a, b) => b.pct - a.pct || a.serie.localeCompare(b.serie, 'pt'),
    falta: (a, b) => b.miss - a.miss || a.serie.localeCompare(b.serie, 'pt'),
    tenho: (a, b) => b.owned.length - a.owned.length || a.serie.localeCompare(b.serie, 'pt')
  };
  list.sort(sorts[C.sort]);
  const totOwned = all.reduce((s, x) => s + x.owned.length, 0);
  const totDone = all.filter(x => x.done && !x.group).length;
  const sel = (key, label, opts) => `<select onchange="C.${key}=this.value;render()"><option value="">${label}</option>${opts.map(o => `<option value="${esc(o[0])}" ${C[key] === o[0] ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
  const filters = `<div class="filters">
    <input id="cqs" type="search" placeholder="Pesquisar série, título, autor…" value="${esc(C.q)}" oninput="C.q=this.value;render();const s=document.getElementById('cqs');s.focus();s.setSelectionRange(s.value.length,s.value.length)">
    ${sel('autor', 'Todos os autores', autores.map(a => [a, a]))}
    ${sel('editora', 'Todas as editoras', editoras.map(a => [a, a]))}
    ${sel('idioma', 'Todos os idiomas', idiomas.map(a => [a, { PT: 'Português', FR: 'Francês', EN: 'Inglês', ES: 'Espanhol' }[a] || a]))}
    ${sel('estado', 'Todas as séries', [['completa', 'Completas'], ['incompleta', 'Incompletas'], ['nova', 'Ainda sem nenhum']])}
    <select onchange="C.sort=this.value;render()">${[['nome', 'Ordenar: nome'], ['pct', '% completa ↓'], ['falta', 'Mais em falta'], ['tenho', 'Mais volumes']].map(o => `<option value="${o[0]}" ${C.sort === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
    <label><input type="checkbox" ${C.soPrio ? 'checked' : ''} onchange="C.soPrio=this.checked;render()"> Só prioritárias</label>
    <span class="count">${totOwned} álbuns · ${totDone} séries completas · ${list.length} séries visíveis</span></div>`;
  return filters + `<div class="grid">${list.map(seriesCard).join('')}</div>`;
}

function seriesCard(x) {
  const img = x.capa ? `<img src="${esc(x.capa)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=ph>📚</div>'">` : `<div class="ph">📚<small>${esc(x.serie)}</small></div>`;
  const edit = DATA.user.owner ? `<div class="cedit"><button title="Capa da série" onclick="event.stopPropagation();editSeriesCover(${esc(JSON.stringify(x.serie))})">✏️</button></div>` : '';
  const kpi = x.group
    ? `<div class="kpi"><span class="big">${x.owned.length}</span><span class="small">álbuns</span></div>`
    : `<div class="kpi"><span class="big">${x.owned.length}/${x.approx ? '≥' : ''}${x.total}</span><span class="small">${x.done ? 'completa' : (x.approx ? 'faltam ' + x.miss + '+' : 'faltam ' + x.miss)}</span></div>
       <div class="bar ${x.done ? 'done' : ''}"><span style="width:${x.pct}%"></span></div>`;
  return `<div class="card scard" onclick='openSerie(${JSON.stringify(x.serie).replace(/'/g, "&#39;")})'>
    <div class="cover">${img}${x.done && !x.group ? '<span class="done-flag">✅ Completa</span>' : ''}${edit}</div>
    <div class="body"><div class="serie">${stars(x.prio)} ${[...x.aut].slice(0, 3).map(esc).join(' · ')}</div>
    <div class="titulo">${esc(x.serie)}</div>${kpi}
    <div class="chips">${[...x.lang].map(l => `<span class="chip">${esc(l)}</span>`).join('')}${[...x.ed].slice(0, 2).map(e => `<span class="chip">${esc(e)}</span>`).join('')}</div></div></div>`;
}

function openSerie(s) { OPEN_SERIE = s; renderSheet(); document.getElementById('sheet').style.display = 'block'; document.body.style.overflow = 'hidden'; }
function closeSheet() { OPEN_SERIE = null; document.getElementById('sheet').style.display = 'none'; document.body.style.overflow = ''; }

function renderSheet() {
  const x = seriesStats().find(y => y.serie === OPEN_SERIE);
  if (!x) { closeSheet(); return; }
  const num = b => { const v = parseFloat(String(b.n).replace(/[^\d.]/g, '')); return isNaN(v) ? 999 : v; };
  const items = x.owned.map(b => ({ b, own: true })).concat(x.missing.map(b => ({ b, own: false })))
    .sort((p, q) => num(p.b) - num(q.b) || (p.b.pt || p.b.orig).localeCompare(q.b.pt || q.b.orig, 'pt'));
  document.getElementById('sheetPanel').innerHTML = `<div class="top"><h2>${esc(x.serie)} ${x.done && !x.group ? '✅' : ''}</h2>
    <span class="small" style="color:var(--muted)">${x.owned.length} tens${x.group ? '' : ' · faltam ' + x.miss + (x.approx ? '+' : '')}</span>
    <button class="close" onclick="closeSheet()">✕</button></div>
    <div class="grid">${items.map(it => it.own ? ownedCard(it.b) : card(it.b)).join('')}</div>`;
}

function ownedCard(b) {
  const title = b.pt || b.orig;
  let action = '<span class="owned-badge">✔ Na coleção</span>';
  if (DATA.user.owner && b.recebido) action += ` <button class="btn sec" style="margin-top:6px" onclick="act('markReceived','${b.id}',false)">Desfazer</button>`;
  return `<div class="card"><div class="cover">${coverHtml(b)}</div><div class="body">
    <div class="serie">${esc(b.serie)}${b.n && b.n !== '—' ? ' · n.º ' + esc(b.n) : ''}</div>
    <div class="titulo">${esc(title)}</div>
    ${b.pt && b.orig && b.orig !== b.pt ? `<div class="orig">${esc(b.orig)}</div>` : ''}
    <div class="chips"><span class="chip">${esc(b.idioma || '')}</span>${splitEd(b.ed).map(e => `<span class="chip">${esc(e)}</span>`).join('')}</div>
    ${b.notas ? `<div class="orig">${esc(b.notas)}</div>` : ''}
    <div class="act">${action}</div></div></div>`;
}

function viewPrio() {
  const s = DATA.series.slice().sort((a, b) => (a.prio || 9) - (b.prio || 9) || a.serie.localeCompare(b.serie, 'pt'));
  return `<p>Escolhe as séries que mais te interessa completar. A família vê-as com estrelas e pode filtrá-las.</p>
  <div class="wrap"><table><tr><th>Série</th><th>Prioridade</th><th>Em falta</th></tr>${s.map(x => `<tr><td>${esc(x.serie)}</td>
  <td><select onchange="act('setPriority',${esc(JSON.stringify(x.serie))},this.value?Number(this.value):'')">
    ${[['', '—'], ['1', '★★★ Alta'], ['2', '★★ Média'], ['3', '★ Baixa']].map(o => `<option value="${o[0]}" ${String(x.prio || '') === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}
  </select></td><td>${DATA.books.filter(b => b.serie === x.serie).length}</td></tr>`).join('')}</table></div>`;
}

function viewTroca() {
  return `<p>Livros em duplicado, disponíveis para troca ou venda.</p><div class="wrap"><table><tr><th>Série</th><th>Título</th><th>Exemplares</th><th>Nota</th></tr>
  ${DATA.dups.map(d => `<tr><td>${esc(d.serie)}</td><td>${esc(d.titulo)}</td><td>${esc(d.n)}</td><td>${esc(d.nota)}</td></tr>`).join('')}</table></div>`;
}
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGis()"></script>
